<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Corner - EveryCorner</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffffff;
    color:#222;
}


/* HEADER */

header {

    background:#7b1e3a;
    color:white;
    text-align:center;
    padding:25px;

}


header img {

    width:90px;

}


/* PROFILE */


.profile-container {

    max-width:900px;

    margin:auto;

}



/* BANNER */


.banner {

    height:250px;

    background:#008c8c;

    background-size:cover;

    background-position:center;

    border-radius:0 0 25px 25px;

}



.profile-card {

    background:white;

    margin-top:-60px;

    position:relative;

    padding:30px;

    border-radius:25px;

    box-shadow:0 8px 20px rgba(0,0,0,.1);

    text-align:center;

}



/* PROFILE IMAGE */


.profile-picture {

    width:140px;

    height:140px;

    border-radius:50%;

    object-fit:cover;

    border:6px solid white;

    margin-top:-100px;

}



h1 {

    color:#7b1e3a;

}


h2 {

    color:#008c8c;

}



/* BUTTONS */


button {

    background:#008c8c;

    color:white;

    border:none;

    padding:12px 25px;

    border-radius:30px;

    cursor:pointer;

    margin:5px;

}



button:hover {

    background:#7b1e3a;

}


/* SETTINGS */


.settings {

    background:#fafafa;

    padding:25px;

    border-radius:20px;

    margin-top:25px;

}


input, textarea {

    width:100%;

    padding:12px;

    margin:8px 0;

    border-radius:10px;

    border:1px solid #ddd;

}


/* POSTS */


.post {

    background:white;

    padding:20px;

    margin-top:15px;

    border-radius:15px;

    border-left:5px solid #008c8c;

}



footer {

    background:#7b1e3a;

    color:white;

    text-align:center;

    padding:20px;

    margin-top:50px;

}


</style>

</head>


<body>


<header>

<img src="everycorner.png">

<h1>EveryCorner</h1>

<p>Your Corner</p>

</header>



<div class="profile-container">



<div class="banner" id="banner">

</div>




<div class="profile-card">


<img id="profilePic" class="profile-picture" src="everycorner.png">


<h1 id="cornerName">
Your Corner Name
</h1>


<p>
Followers: 0
</p>



<button>
Add Friend
</button>


<button>
Settings
</button>



</div>




<div class="settings">


<h2>Profile Settings</h2>



<label>
Upload Banner
</label>

<input type="file" onchange="uploadBanner(event)">



<label>
Upload Profile Picture
</label>

<input type="file" onchange="uploadProfile(event)">



<label>
Corner Name
</label>

<input id="nameInput" placeholder="Enter Corner Name">



<button onclick="saveProfile()">
Save Changes
</button>


</div>




<div class="settings">


<h2>Create Post</h2>


<textarea id="postText" placeholder="Share something..."></textarea>


<button onclick="post()">
Post
</button>



<div id="posts">

</div>


</div>



</div>




<footer>

<p>
© 2026 EveryCorner. All rights reserved.
</p>

</footer>





<script>


function uploadBanner(event){

let image = URL.createObjectURL(event.target.files[0]);

document.getElementById("banner").style.backgroundImage =
"url("+image+")";

}



function uploadProfile(event){

let image = URL.createObjectURL(event.target.files[0]);

document.getElementById("profilePic").src=image;

}



function saveProfile(){

let name=document.getElementById("nameInput").value;


if(name){

document.getElementById("cornerName").innerHTML=name;

}

}



function post(){

let text=document.getElementById("postText").value;


if(text){

document.getElementById("posts").innerHTML +=

`
<div class="post">
${text}
</div>
`;

document.getElementById("postText").value="";

}

}


</script>



</body>

</html>
