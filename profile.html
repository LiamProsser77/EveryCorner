<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EveryCorner Profile</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:Arial,sans-serif;
background:white;
color:#222;

}


header{

text-align:center;
padding:30px;

}


header img{

width:100px;

}


h1,h2{

color:#7b1e3a;

}



.banner{

height:280px;
background:#008c8c;
background-size:cover;
background-position:center;

}



.profile{

max-width:850px;
margin:-70px auto 30px;
background:white;
padding:35px;
text-align:center;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,.15);

}




.profile-picture{

width:160px;
height:160px;
border-radius:50%;
object-fit:cover;
border:6px solid white;

}





button{

background:#008c8c;
color:white;
border:none;
padding:13px 30px;
border-radius:30px;
cursor:pointer;
font-weight:bold;
margin:5px;

}



button:hover{

background:#7b1e3a;

}




.box{

max-width:850px;
margin:25px auto;
padding:30px;
background:#fafafa;
border-radius:20px;

}




input,textarea{

width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;

}



textarea{

height:120px;

}




.post{

background:white;
padding:15px;
margin-top:15px;
border-left:5px solid #008c8c;
border-radius:10px;

}



footer{

background:#7b1e3a;
color:white;
text-align:center;
padding:25px;
margin-top:50px;

}



</style>

</head>


<body>


<header>

<img src="everycorner.png">

<h1>EveryCorner</h1>

</header>



<div 
id="banner"
class="banner">
</div>




<div class="box">

<h2>Find Corners</h2>


<input

id="searchUsers"

placeholder="Search users..."

oninput="searchUsers()">



<div id="searchResults"></div>


</div>




<div class="profile">


<img

id="profilePic"

class="profile-picture"

src="everycorner.png">


<h2 id="cornerName">

Loading...

</h2>



<p id="followers">

0 Followers

</p>


<p id="friends">

0 Friends

</p>


<button

onclick="logout()">

Logout

</button>


</div>


<div

class="box"

id="settings">


<h2>

Corner Settings

</h2>



<p>

Upload Profile Picture

</p>



<input

type="file"

accept="image/*"

onchange="uploadProfile(event)">





<p>

Upload Banner

</p>



<input

type="file"

accept="image/*"

onchange="uploadBanner(event)">





<input

id="nameInput"

placeholder="Change Corner Name">





<button

onclick="saveProfile()">

Save Corner Name

</button>



</div>







<div

class="box"

id="postBox">


<h2>

Create Post

</h2>




<textarea

id="postText"

placeholder="Write a post...">

</textarea>





<button

onclick="createPost()">

Post

</button>





<div

id="posts">

</div>



</div>







<footer>

© 2026 EveryCorner

</footer>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="app.js"></script>

<script src="friend.js"></script>

<script src="friendcount.js"></script>


</body>

</html>
