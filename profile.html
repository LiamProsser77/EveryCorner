<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EveryCorner - Your Corner</title>

<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;
    font-family:Arial,sans-serif;
    background:white;
    color:#222;

}


/* TOP */

header {

    background:white;
    text-align:center;
    padding:30px;

}


header img {

    width:100px;
}


header h1 {

    color:#7b1e3a;

}



/* PROFILE AREA */


.container {

    max-width:900px;
    margin:auto;

}



.banner {

    height:260px;

    background:#008c8c;

    border-radius:0 0 25px 25px;

    background-size:cover;

    background-position:center;

}




.profile {

    background:white;

    margin:-70px 20px 0;

    position:relative;

    padding:30px;

    border-radius:25px;

    text-align:center;

    box-shadow:0 8px 20px rgba(0,0,0,.1);

}




.profile-picture {

    width:150px;

    height:150px;

    border-radius:50%;

    object-fit:cover;

    border:6px solid white;

}



h2 {

    color:#7b1e3a;

}


.teal {

    color:#008c8c;

}




button {

    background:#008c8c;

    color:white;

    border:none;

    padding:13px 25px;

    border-radius:30px;

    cursor:pointer;

    margin:5px;

    font-weight:bold;

}


button:hover {

    background:#7b1e3a;

}





.box {

    background:#fafafa;

    margin:30px 20px;

    padding:30px;

    border-radius:25px;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

}



input, textarea {


    width:100%;

    padding:12px;

    margin:10px 0;

    border-radius:10px;

    border:1px solid #ddd;

}




.post {


    background:white;

    padding:20px;

    margin-top:15px;

    border-radius:15px;

    border-left:5px solid #008c8c;


}



footer {


    background:#7b1e3a;

    color:white;

    text-align:center;

    padding:25px;

    margin-top:50px;


}


</style>


</head>


<body>



<header>

<img src="everycorner.png">

<h1>EveryCorner</h1>

<p class="teal">
Your community. Your Corner.
</p>


</header>




<div class="container">



<div id="banner" class="banner">

</div>




<div class="profile">


<img 
id="profilePic"
class="profile-picture"
src="everycorner.png">



<h2 id="cornerName">
Loading Corner...
</h2>


<p>
Followers: 0
</p>



<button>
Add Friend
</button>


<button onclick="showSettings()">
Settings
</button>


</div>





<div class="box" id="settings">


<h2>Corner Settings</h2>



<label>
Upload Banner
</label>

<input 
type="file"
onchange="uploadBanner(event)">



<label>
Upload Profile Picture
</label>


<input
type="file"
onchange="uploadProfile(event)">



<label>
Change Corner Name
</label>


<input
id="nameInput"
placeholder="New Corner Name">



<button onclick="saveProfile()">
Save
</button>


</div>





<div class="box">


<h2>Create Post</h2>


<textarea 
id="postText"
placeholder="Share something with your Corner...">
</textarea>



<button onclick="createPost()">
Post
</button>



<div id="posts">

</div>


</div>





</div>





<footer>

<p>
© 2026 EveryCorner. All rights reserved.
</p>

</footer>




<script src="app.js"></script>


<script>


function showSettings(){

document.getElementById("settings").scrollIntoView();

}


</script>



</body>

</html>
