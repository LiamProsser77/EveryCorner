<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>EveryCorner Profile</title>


<style>

body{

margin:0;
font-family:Arial;
background:white;
color:#222;

}


header{

text-align:center;
padding:30px;

}


header img{

width:100px;

}


h1,h2{

color:#7b1e3a;

}



.banner{

height:260px;

background:#008c8c;

background-size:cover;

background-position:center;

}



.profile{

max-width:800px;

margin:-70px auto 20px;

background:white;

padding:30px;

border-radius:25px;

text-align:center;

box-shadow:0 8px 20px #ccc;

}



.profile-picture{

width:150px;

height:150px;

border-radius:50%;

object-fit:cover;

border:5px solid white;

}



button{

background:#008c8c;

color:white;

border:none;

padding:12px 25px;

border-radius:30px;

cursor:pointer;

margin:5px;

}


button:hover{

background:#7b1e3a;

}



.box{

max-width:800px;

margin:30px auto;

background:#fafafa;

padding:25px;

border-radius:20px;

}



input,textarea{

width:100%;

padding:12px;

margin:10px 0;

}



.post{

background:white;

padding:15px;

margin:10px;

border-left:5px solid #008c8c;

border-radius:10px;

}



footer{

background:#7b1e3a;

color:white;

text-align:center;

padding:20px;

}


</style>

</head>


<body>


<header>

<img src="everycorner.png">

<h1>EveryCorner</h1>

</header>



<div id="banner" class="banner"></div>



<div class="profile">


<img id="profilePic"
class="profile-picture"
src="everycorner.png">


<h2 id="cornerName">
Loading...
</h2>



<button onclick="addFriend()">
Add Friend
</button>



</div>





<div class="box">


<h2>Settings</h2>


<p>Upload Banner</p>

<input type="file"
onchange="uploadBanner(event)">



<p>Upload Profile Picture</p>

<input type="file"
onchange="uploadProfile(event)">



<input id="nameInput"
placeholder="Change Corner Name">


<button onclick="saveProfile()">
Save
</button>


</div>




<div class="box">


<h2>Create Post</h2>


<textarea id="postText"
placeholder="Write something...">
</textarea>


<button onclick="createPost()">
Post
</button>


<div id="posts"></div>


</div>




<footer>

© 2026 EveryCorner

</footer>




<script src="app.js"></script>


</body>

</html>
