<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - EveryCorner</title>


<style>

body {

margin:0;
font-family:Arial,sans-serif;
background:white;

}


header {

text-align:center;
padding:40px;

}


header img {

width:150px;

}


h1 {

color:#7b1e3a;

}


.box {

max-width:400px;
margin:auto;
background:#fafafa;
padding:35px;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,.1);

}


h2 {

color:#008c8c;
text-align:center;

}


input {

width:100%;
padding:15px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;

}


button {

width:100%;
padding:15px;
background:#008c8c;
color:white;
border:none;
border-radius:30px;
font-weight:bold;
cursor:pointer;

}


button:hover {

background:#7b1e3a;

}


a {

color:#008c8c;

}

</style>


</head>


<body>


<header>

<img src="everycorner.png">

<h1>EveryCorner</h1>

<p>Create your Corner</p>

</header>




<div class="box">


<h2>Sign Up</h2>



<form onsubmit="signup(event)">



<input 
id="username"
type="text"
placeholder="Choose Username"
required>




<input
id="password"
type="password"
placeholder="Create Password"
required>




<button type="submit">
Create Account
</button>



</form>



<p id="message"></p>



<p>

Already have an account?

<a href="signin.html">
Sign In
</a>

</p>


</div>





<script src="app.js"></script>



<script>


function signup(event){


event.preventDefault();



let username =
document.getElementById("username").value.trim();



let password =
document.getElementById("password").value;



let result =
createAccount(
username,
password
);



let message =
document.getElementById("message");



if(result){


message.innerHTML =
"Account created! Redirecting...";



setTimeout(function(){


window.location.href =
"profile.html?user=" + username;



},1000);



}

else{


message.innerHTML =
"Username already exists";


}


}


</script>



</body>

</html>
