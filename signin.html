<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In - EveryCorner</title>


<style>

body {

margin:0;
font-family:Arial,sans-serif;
background:white;

}


header {

text-align:center;
padding:40px;

}


header img {

width:150px;

}


h1 {

color:#7b1e3a;

}


.box {

max-width:400px;
margin:auto;
background:#fafafa;
padding:35px;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,.1);

}


h2 {

color:#008c8c;
text-align:center;

}


input {

width:100%;
padding:15px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;

}


button {

width:100%;
padding:15px;
background:#008c8c;
color:white;
border:none;
border-radius:30px;
font-weight:bold;
cursor:pointer;

}


button:hover {

background:#7b1e3a;

}


a {

color:#008c8c;

}

</style>


</head>


<body>


<header>

<img src="everycorner.png">

<h1>EveryCorner</h1>

<p>Welcome back</p>

</header>




<div class="box">


<h2>Sign In</h2>



<form onsubmit="signIn(event)">



<input
id="username"
type="text"
placeholder="Username"
required>



<input
type="password"
placeholder="Password"
required>



<button>
Sign In
</button>



</form>



<p>
Need an account?

<a href="signup.html">
Sign Up
</a>

</p>


</div>



<script src="app.js"></script>


</body>

</html>
