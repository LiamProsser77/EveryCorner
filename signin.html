<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In - EveryCorner</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #ffffff;

    color: #222;

}


/* HEADER */

header {

    text-align: center;

    padding: 40px 20px;

}


header img {

    width: 150px;

    height: 150px;

    object-fit: contain;

    border-radius: 25px;

}


h1 {

    color: #7b1e3a;

    font-size: 42px;

    margin: 15px 0;

}


.tagline {

    color: #008c8c;

    font-size: 22px;

}



/* SIGN IN BOX */


.signin-box {

    max-width: 450px;

    margin: 30px auto;

    background: #fafafa;

    padding: 40px;

    border-radius: 25px;

    box-shadow: 0 8px 20px rgba(0,0,0,0.1);

    border-top: 7px solid #008c8c;

}



.signin-box h2 {

    text-align: center;

    color: #7b1e3a;

}



input {

    width: 100%;

    padding: 15px;

    margin: 10px 0;

    border: 1px solid #ddd;

    border-radius: 12px;

    font-size: 16px;

}



button {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    background: #008c8c;

    color: white;

    border: none;

    border-radius: 30px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}



button:hover {

    background: #7b1e3a;

}



/* LINKS */


.links {

    text-align: center;

    margin-top: 25px;

}



.links a {

    color: #008c8c;

    text-decoration: none;

    font-weight: bold;

}



/* FOOTER */


footer {

    background: #7b1e3a;

    color: white;

    text-align: center;

    padding: 20px;

    margin-top: 60px;

}


</style>


</head>


<body>



<header>


<img src="everycorner.png" alt="EveryCorner Logo">


<h1>EveryCorner</h1>


<p class="tagline">

Welcome back to your Corner.

</p>


</header>




<div class="signin-box">


<h2>Sign In</h2>



<form>


<input type="email" placeholder="Email Address" required>


<input type="password" placeholder="Password" required>



<button type="submit">

Sign In

</button>


<form action="profile.html">




<div class="links">


<p>

Don't have an account?

<a href="signup.html">Create One</a>

</p>



<p>

<a href="index.html">Back to EveryCorner</a>

</p>


</div>



</div>




<footer>


<p>

© 2026 EveryCorner. All rights reserved.

</p>


</footer>



</body>

</html>
